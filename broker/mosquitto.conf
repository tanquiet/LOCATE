# Locate demo broker (Mosquitto 2.x)
#
# Run it FROM THIS FOLDER so the relative password file path resolves:
#   Windows:  & "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
#   Linux:    mosquitto -c mosquitto.conf -v
#
# Create the password file first (see README, "Broker setup").

per_listener_settings false
allow_anonymous false
password_file passwd

# Plain MQTT: the ESP32 over WiFi, and over GSM through a tunnel / port-forward
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets: the web app (laptop and phones)
listener 9001 0.0.0.0
protocol websockets

# Config messages for the tracker are queued in memory while it is silent in
# Mode B (lost only if the broker itself restarts - fine for a demo)
persistence false
max_queued_messages 100
