<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locate</title>
  <!-- GitHub Pages serves the repository root. The app lives in app/, so send visitors
       there. Anything after ? (for example ?demo=1) is kept. -->
  <script>location.replace('app/' + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=app/">
</head>
<body style="font: 16px system-ui, sans-serif; background: #0b0b14; color: #fff; padding: 24px">
  <p>Opening Locate… <a href="app/" style="color: #00e5ff">Tap here if it does not open.</a></p>
</body>
</html>
